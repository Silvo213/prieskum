<!DOCTYPE html>
<html lang="sk">
<head>

<body>

<main class="obsah" id="obsah">

    <button type="button" id="spat" class="spat skryte">Späť</button>

<input class="mimo-obrazovky" id="prezyvka" name="prezyvka" type="text" tabindex="-1" autocomplete="off">
